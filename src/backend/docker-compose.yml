services:
  postgres:
    image: postgres:16-alpine
    container_name: scald-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scald}
      POSTGRES_USER: ${POSTGRES_USER:-scald}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scald_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - scald_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  scald_postgres_data:
